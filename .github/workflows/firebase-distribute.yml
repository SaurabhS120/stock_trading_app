name: Distribute Flutter App to Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      TESTERS_GROUP: ${{ secrets.TESTERS_GROUP }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"

      # 1️⃣ Flutter or Dart cache
      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # 2️⃣ Gradle cache (for Android builds)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Create Google Services file
        run: |
          set -euo pipefail 
          echo "$ANDROID_GOOGLE_SERVICES" | base64 --decode > android/app/google-services.json

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase App Distribution
        run: |
          set -euo pipefail 
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTERS_GROUP" \
            --release-notes "$(cat release_notes.txt)"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
